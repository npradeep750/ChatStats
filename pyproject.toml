[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-analytics"
version = "0.1.0"
description = "Privacy-first group chat stats and characterizations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pandas>=2.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
chat-analyze = "processing.chat_processing.cli:main"

[tool.setuptools.packages.find]
include = ["processing*"]
